<!doctype html>
<html lang="vi">
<head>
<style>
  body { display: flex; align-items: center; justify-content: center; }
  #chu { font: 900 140px/1.15 var(--font-tieu-de); color: var(--mau-sang); white-space: nowrap; text-align: center;
         paint-order: stroke fill; -webkit-text-stroke: 14px var(--mau-toi); margin-top: -60px; }
  #chu span { display: inline-block; transform-origin: 50% 90%; }
  #chu span.nhan { color: var(--mau-nhan); }
  #phu { position: absolute; bottom: 10%; left: 0; right: 0; text-align: center; font: 700 44px var(--font-nhan);
         color: var(--mau-nhan2); text-transform: uppercase; }
</style>
</head>
<body>
<div id="chu"></div>
<div id="phu"></div>
<script>
const P = Object.assign({ text: "Bứt phá giới hạn", nhan: ["giới", "hạn"], phu: "Mỗi ngày một bước", tre: 0.05 }, window.PROPS);
const chu = document.getElementById("chu"), phu = document.getElementById("phu");
const spans = [];
P.text.split(" ").forEach((tu, j, a) => {
  [...tu].forEach(ch => { const s = document.createElement("span"); s.textContent = ch;
    if (P.nhan.includes(tu)) s.className = "nhan"; chu.appendChild(s); spans.push(s); });
  if (j < a.length - 1) chu.appendChild(document.createTextNode(" "));
});
phu.textContent = P.phu;
// vừa hộp: đo bề rộng thật của dòng chữ rồi thu cỡ — làm trong veTai lần đầu (lúc đó máy đã nạp xong font → tất định)
let daVua = false;
const vua = () => { daVua = true; const r = chu.scrollWidth / (innerWidth * 0.94);
  if (r > 1) chu.style.fontSize = parseFloat(getComputedStyle(chu).fontSize) / r + "px"; };
// lò xo tắt dần (giải tích, tất định): x(u) = 1 − e^(−ζωu)·cos(ω√(1−ζ²)·u)
const loXo = (u, w = 18, z = 0.32) => u <= 0 ? 0 : 1 - Math.exp(-z * w * u) * Math.cos(w * Math.sqrt(1 - z * z) * u);
window.veTai = (t, dur) => {
  if (!daVua) vua();
  spans.forEach((s, i) => {
    const u = t - i * P.tre, k = loXo(u);
    const y = (1 - k) * 160, sc = 0.3 + 0.7 * k, xoay = (1 - k) * (i % 2 ? 14 : -14);
    s.style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(4)}) rotate(${xoay.toFixed(2)}deg)`;
    s.style.opacity = Math.min(1, Math.max(0, u / 0.12)).toFixed(3);
  });
  const v = Math.min(1, Math.max(0, (t - 0.9) / 0.5));
  phu.style.opacity = v.toFixed(3); phu.style.letterSpacing = (0.6 - 0.3 * v).toFixed(3) + "em";
  const r = Math.min(1, Math.max(0, (t - (dur - 0.35)) / 0.35));        // ra: mờ 0.35 s cuối
  document.body.style.opacity = (1 - r).toFixed(3);
};
</script>
</body>
</html>
